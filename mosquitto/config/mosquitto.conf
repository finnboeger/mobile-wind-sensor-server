# Mosquitto broker for the wind sensor stack.
#
# One plain listener, only reachable inside the docker network. The boats
# connect through a reverse proxy (e.g. Traefik, see docker-compose.traefik.yml)
# that terminates TLS and forwards to it; mqtt-ingestion connects directly.
#
# Every client needs a username/password from passwd and is restricted by acl.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883

# Keep sessions and queued QoS 1/2 messages across broker restarts (e.g. for
# a subscriber with a persistent session that is offline at the time)
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
