# Mosquitto broker for the wind sensor stack.
#
# Two listeners:
#   1883  plain MQTT, only reachable inside the docker network (mqtt-ingestion)
#   8883  MQTT over TLS, published to the internet for the boats
#
# Both require a username/password from passwd and are restricted by acl.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Boats publish at QoS 0 over 4G, so nothing needs to survive a broker restart
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
