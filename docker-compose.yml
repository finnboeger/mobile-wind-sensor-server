version: '3.8'

services:
  # PocketBase: shared database with public read / authenticated write
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: wind-dashboard-pocketbase
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pocketbase_data:/pb_data
      - pocketbase_migrations:/pb_migrations
    environment:
      - POCKETBASE_ENCRYPTION_KEY=${POCKETBASE_ENCRYPTION_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wind-network

  # Dashboard Server: Express + Vue frontend + PocketBase bootstrap
  dashboard-server:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: wind-dashboard-server
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      # PocketBase configuration
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_PUBLIC_URL: ${POCKETBASE_PUBLIC_URL:-http://pocketbase:8090}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-admin@example.com}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-adminadmin}

      # UI defaults
      DEFAULT_TIMEFRAME_MINUTES: ${DEFAULT_TIMEFRAME_MINUTES:-15}
      DIRECTION_AVERAGE_MODE: ${DIRECTION_AVERAGE_MODE:-weighted}
      DEFAULT_SMOOTHING_WINDOW_MINUTES: ${DEFAULT_SMOOTHING_WINDOW_MINUTES:-5}

      # Server configuration
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production

    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wind-network
    restart: unless-stopped

  # MQTT Ingestion Service: subscribes to MQTT, writes to PocketBase (Docker only)
  mqtt-ingestion:
    build:
      context: ./mqtt-ingestion
      dockerfile: Dockerfile
    container_name: wind-mqtt-ingestion
    environment:
      # MQTT configuration
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPICS: ${MQTT_TOPICS:-wind/sensor1=sensor_1,wind/sensor2=sensor_2}

      # PocketBase configuration
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-admin@example.com}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-adminadmin}

      # Service configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      pocketbase:
        condition: service_healthy
      dashboard-server:
        condition: service_healthy
    networks:
      - wind-network
    restart: unless-stopped

  # Optional: Mosquitto MQTT broker (for testing)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: wind-mosquitto
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - wind-network
    restart: unless-stopped
    # Note: LoRaWAN ingestion service removed for now (will be implemented separately using lora module)

  # SAP Sailing Uplink: forwards true wind from PocketBase to SAP Sailing's putWind API.
  # Off by default; enable with COMPOSE_PROFILES=sap (see sap-uplink/README.md)
  sap-uplink:
    build:
      context: ./sap-uplink
      dockerfile: Dockerfile
    container_name: wind-sap-uplink
    profiles: ["sap"]
    environment:
      # SAP Sailing configuration
      SAP_URL: ${SAP_URL:-}
      SAP_USER: ${SAP_USER:-}
      SAP_PASSWORD: ${SAP_PASSWORD:-}
      SAP_BEARER_TOKEN: ${SAP_BEARER_TOKEN:-}
      SAP_SOURCES: ${SAP_SOURCES:-}
      SAP_EVENT_ID: ${SAP_EVENT_ID:-}
      SAP_COURSE_AREA: ${SAP_COURSE_AREA:-}
      SAP_RACES: ${SAP_RACES:-}
      SAP_ALL_RACES: ${SAP_ALL_RACES:-false}
      SAP_WIND_SOURCE_TYPE: ${SAP_WIND_SOURCE_TYPE:-EXPEDITION}
      SAP_START_FROM: ${SAP_START_FROM:-}
      SAP_POLL_SECONDS: ${SAP_POLL_SECONDS:-5}
      SAP_BATCH_SIZE: ${SAP_BATCH_SIZE:-200}

      # PocketBase configuration (measurements are publicly readable)
      POCKETBASE_URL: http://pocketbase:8090

      # Service configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - sap_uplink_data:/data
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - wind-network
    restart: unless-stopped

networks:
  wind-network:
    driver: bridge

volumes:
  pocketbase_data:
  pocketbase_migrations:
  mosquitto_config:
  mosquitto_data:
  mosquitto_logs:
  sap_uplink_data:
